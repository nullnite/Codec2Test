; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52
board = rak4630
framework = arduino
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_unflags = -Os
build_flags =
  -I rakwireless/variants/rak4630
  -DCODEC2_MODE_EN_DEFAULT=0
  -DCODEC2_MODE_2400_EN=1
  -DCORTEX_M4
  -D__EMBEDDED__
  -DFDV_ARM_MATH
  -DARM_MATH_CM4
  -l arm_cortexM4lf_math ; from https://github.com/ARM-software/CMSIS_5/tree/5.7.0/CMSIS/DSP/Lib/GCC
  -O2
lib_deps = beegee-tokyo/SX126x-Arduino @ ^2.0.0
monitor_speed = 115200
